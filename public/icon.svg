<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.90"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Squircle (Apple iOS / macOS Icon standard) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Document Archive Symbol Stack -->
  <g filter="url(#shadow)" transform="translate(106, 96)">
    <!-- Back Sheet -->
    <rect x="50" y="20" width="200" height="260" rx="16" fill="#94a3b8" opacity="0.5"/>
    <!-- Middle Sheet -->
    <rect x="30" y="40" width="220" height="260" rx="16" fill="#cbd5e1" opacity="0.8"/>
    <!-- Front Document Sheet -->
    <rect x="10" y="60" width="240" height="270" rx="20" fill="url(#cardGrad)"/>
    
    <!-- Document Lines -->
    <rect x="35" y="105" width="100" height="12" rx="6" fill="#0284c7"/>
    <rect x="35" y="135" width="190" height="8" rx="4" fill="#94a3b8"/>
    <rect x="35" y="155" width="170" height="8" rx="4" fill="#94a3b8"/>
    <rect x="35" y="175" width="180" height="8" rx="4" fill="#94a3b8"/>
    <rect x="35" y="195" width="130" height="8" rx="4" fill="#94a3b8"/>

    <!-- Vault / Shield Lock Badge -->
    <circle cx="195" cy="285" r="38" fill="#0284c7"/>
    <!-- Lock Icon -->
    <path d="M195 267 C189 267 185 271 185 277 L185 283 L205 283 L205 277 C205 271 201 267 195 267 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <rect x="181" y="283" width="28" height="20" rx="4" fill="#ffffff"/>
    <circle cx="195" cy="292" r="3" fill="#0284c7"/>
  </g>
</svg>
